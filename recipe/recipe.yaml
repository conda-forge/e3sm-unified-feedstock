schema_version: 1

context:
  name: e3sm-unified
  version: "1.13.0rc4"
  build: 0
  mpi: ${{ mpi or "nompi" }}
  mpi_prefix: ${{ "nompi" if mpi in ["nompi", "hpc"] else "mpi_" + mpi }}
  build_prefix: ${{ mpi if mpi in ["nompi", "hpc"] else "mpi_" + mpi }}

package:
  name: ${{ name }}
  version: ${{ version }}

build:
  number: ${{ build }}
  skip:
    - win or match(python, "<3.11") or match(python, ">=3.14")

  # add build string so packages can depend on
  # mpi or nompi variants explicitly:
  # `e3sm-unified * mpi_mpich_*` for mpich
  # `e3sm-unified * mpi_*` for any mpi
  # `e3sm-unified * nompi_*` for no mpi
  string: ${{ build_prefix }}_py${{ python | version_to_buildstring }}h${{ hash }}_${{ build }}

requirements:
  host:
    - python
  run:
    ### main packages ###
    - python
    - r
    # cdo hasn't migrated to proj 9.8 yet
    #- cdo
    - chemdyg ==1.1.1
    - cprnc ==1.1.4
    - e3sm_diags ==3.2.0rc1
    - e3sm_to_cmip ==1.14.0rc1
    - geometric_features ==1.6.1
    - globus-cli >=3.15.0
    - ipython
    - jupyter
    - livvext ==1.1.0
    - livvkit ==3.3.1
    - mache ==3.3.0
    #- mosaic ==1.2.1
    - mpas-analysis ==1.15.0rc1
    - mpas_tools ==1.5.0rc1
    - pcmdi_metrics ==4.0.1
    - uxarray >=2024.12.0
    - xcdat ==0.11.2
    #- zppy ==3.1.0
    - zppy-interfaces ==0.2.1rc1
    - if: mpi != "hpc"
      then:
        # until https://github.com/conda-forge/moab-feedstock/pull/111 is merged
        - if: target_platform != "linux-aarch64"
          then: moab ==5.6.0 ${{ mpi_prefix }}_tempest_*
        - nco ==5.3.7
        - tempest-remap ==2.2.0
        - tempest-extremes ==2.4.2 ${{ mpi_prefix }}_*
    - if: mpi != "nompi" and mpi != "hpc"
      then: ilamb ==2.7.3
    - if: linux
      then:
        - e3sm-tools ==3.0.2
        - squadgen ==1.2.2
        - zstash ==1.6.0rc1

    ### mkdocs
    - mkdocs-material
    - pymdown-extensions
    - mkdocs-monorepo-plugin
    - mdutils
    - mkdocs-bibtex ==2.18.0
    - mkdocs-redirects
    - markdownlint-cli2

    ### dependencies ###
    - if: mpi != "nompi" and mpi != "hpc"
      then: ${{ mpi }}
    - blas
    - bottleneck
    - cartopy >=0.17.0
    - cmocean
    - dask ==2026.3.0
    - dogpile.cache
    - eofs
    - esmf ==8.9.1 ${{ mpi_prefix }}_*
    - esmpy ==8.9.1
    - f90nml
    - ffmpeg
    - globus-sdk
    - gsw
    - hdf5 ==1.14.6 ${{ mpi_prefix }}_*
    - ipygany
    - libnetcdf ==4.10.0 ${{ mpi_prefix }}_*
    - lxml
    - matplotlib-base ==3.10.8
    - metpy
    - if: mpi != "nompi" and mpi != "hpc"
      then: mpi4py
    - ncview ==2.1.11
    - ncvis-climate ==2024.01.26
    - nc-time-axis
    - netcdf4 ==1.7.4 nompi_*
    - notebook
    - numpy >=2.0.0,<3.0.0
    - if: mpi == "openmpi"
      then: openssh
    - output_viewer ==1.3.3
    - pillow
    - plotly
    - progressbar2
    - proj ==9.8.0
    - pyevtk
    - pyproj ==3.7.2
    - pyremap
    - pytest
    - pytorch ==2.10.0
    - pywavelets
    - r-tidyverse
    - r-dplyr ==1.2.0
    - r-ggplot2
    - scikit-image
    - scipy >=0.9.0
    - shapely
    - sympy >=0.7.6
    - tabulate
    - windspharm
    - xarray ==2026.2.0
    - xesmf ==0.9.2

    # additional ilamb 2.7.3 dependencies, for system MPI builds
    - if: mpi == "hpc"
      then:
        - cython
        - cf-units >=2.0.0
        - psutil
        - pandas

tests:
  - python:
      imports:
        - chemdyg
        - e3sm_diags
        - e3sm_to_cmip
        - mpas_analysis
        - IPython
        - globus_cli
        - livvext
        - livvkit
        - mache
        #- zppy
        - if: mpi != "nompi" and mpi != "hpc"
          then: ILAMB
        - if: linux
          then: zstash
      # nodejs (via livvkit) won't pass pip check
      pip_check: false

  - script:
      - mpas_analysis --version
      - lex-cfg --help
      - livv --version
      - e3sm_diags --help
      - jupyter --help
      - ipython -h
      - ipython3 -h
      - globus --help
      #- zppy --help
      - if: linux
        then:
          - zstash --help
      - if: mpi != "nompi" and mpi != "hpc"
        then:
          - ilamb-fetch -h
          - ilamb-run -h
      - if: mpi != "hpc"
        then:
          - ncks --help
          - ncap2 --help
          - GenerateCSMesh --res 64 --alt --file gravitySam.000000.3d.cubedSphere.g
          - ESMF_RegridWeightGen --help
          - test -f ${PREFIX}/bin/Climatology

about:
  homepage: https://github.com/E3SM-Project/e3sm-unified
  summary: |
    A metapackage for a unified conda environment for analysis of results
    from the Energy Exascale Earth System Model (E3SM).
  license: BSD-3-Clause
  license_file: LICENSE
  repository: https://github.com/E3SM-Project/e3sm-unified
  documentation: https://github.com/E3SM-Project/e3sm-unified/blob/main/README.md


extra:
  recipe-maintainers:
    - andrewdnolan
    - xylar

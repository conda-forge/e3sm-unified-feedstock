schema_version: 1

context:
  name: e3sm-unified
  version: "1.12.0"
  build: 1
  mpi: ${{ mpi or "nompi" }}
  mpi_prefix: ${{ "nompi" if mpi in ["nompi", "hpc"] else "mpi_" + mpi }}
  build_prefix: ${{ mpi if mpi in ["nompi", "hpc"] else "mpi_" + mpi }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/E3SM-Project/e3sm-unified/archive/${{ version }}.tar.gz
  sha256: 592f37e7ba1aa5db4f8f2b2f1a8292198b1603843fe63f1b089f3f4f0751048b

build:
  number: ${{ build }}
  skip:
    - win or match(python, "<3.11") or match(python, ">=3.14")

  # add build string so packages can depend on
  # mpi or nompi variants explicitly:
  # `e3sm-unified * mpi_mpich_*` for mpich
  # `e3sm-unified * mpi_*` for any mpi
  # `e3sm-unified * nompi_*` for no mpi
  string: ${{ build_prefix }}_py${{ python | version_to_buildstring }}h${{ hash }}_${{ build }}

requirements:
  host:
    - python
  run:
    ### main packages ###
    - python
    - r
    - cdo
    - chemdyg ==1.1.1
    - e3sm_diags ==3.1.0
    - e3sm_to_cmip ==1.13.0
    - geometric_features ==1.6.1
    - globus-cli >=3.15.0
    - ipython
    - jupyter
    - livvkit ==3.2.0
    - mache ==2.0.0
    - mosaic ==1.2.1
    - mpas-analysis ==1.14.0
    - mpas_tools ==1.4.0
    - pcmdi_metrics ==4.0.1
    - uxarray >=2024.12.0
    - xcdat ==0.10.1
    - zppy ==3.1.0
    - zppy-interfaces ==0.2.0
    - if: mpi != "hpc"
      then:
        - moab ==5.6.0 ${{ mpi_prefix }}_tempest_*
        - nco ==5.3.6
        - tempest-remap ==2.2.0
        - tempest-extremes ==2.4 ${{ mpi_prefix }}_*
    - if: mpi != "nompi" and mpi != "hpc"
      then: ilamb ==2.7.2
    - if: linux
      then:
        - e3sm-tools ==3.0.2
        - squadgen ==1.2.2
        - zstash ==1.5.0

    ### mkdocs
    - mkdocs-material
    - pymdown-extensions
    - mkdocs-monorepo-plugin
    - mdutils
    - mkdocs-bibtex ==2.18.0
    - mkdocs-redirects
    - markdownlint-cli2

    ### dependencies ###
    - if: mpi != "nompi" and mpi != "hpc"
      then: ${{ mpi }}
    - blas
    - bottleneck
    - cartopy >=0.17.0
    - cmocean
    - dask ==2025.9.1
    - dogpile.cache
    - eofs
    - esmf ==8.9.0 ${{ mpi_prefix }}_*
    - esmpy ==8.9.0
    - f90nml
    - ffmpeg
    - globus-sdk
    - gsw
    - hdf5 ==1.14.6 ${{ mpi_prefix }}_*
    - ipygany
    - libnetcdf ==4.9.3 ${{ mpi_prefix }}_*
    - lxml
    - matplotlib-base ==3.10.6
    - metpy
    - if: mpi != "nompi" and mpi != "hpc"
      then: mpi4py
    - ncview ==2.1.8
    - ncvis-climate ==2024.01.26
    - nc-time-axis
    - netcdf4 ==1.7.2 nompi_*
    - notebook
    - numpy >=2.0.0
    - if: mpi == "openmpi"
      then: openssh
    - output_viewer ==1.3.3
    - pillow
    - plotly
    - progressbar2
    - proj ==9.6.2
    - pyevtk
    - pyproj ==3.7.2
    - pyremap
    - pytest
    - pywavelets
    - r-tidyverse
    - r-dplyr ==1.1.4
    - r-ggplot2
    - scikit-image
    - scipy >=0.9.0
    - shapely
    - sympy >=0.7.6
    - tabulate
    - windspharm
    - xarray ==2025.9.0
    - xesmf ==0.8.8

    # additional ilamb 2.7 dependencies, for system MPI builds
    - if: mpi == "hpc"
      then:
        - cython
        - cf-units >=2.0.0
        - psutil
        - pandas

tests:
  - python:
      imports:
        - chemdyg
        - e3sm_diags
        - e3sm_to_cmip
        - mpas_analysis
        - IPython
        - globus_cli
        - livvkit
        - mache
        - zppy
        - if: mpi != "nompi" and mpi != "hpc"
          then: ILAMB
        - if: linux
          then: zstash

  - script:
      - mpas_analysis --version
      - livv --version
      - e3sm_diags --help
      - jupyter --help
      - ipython -h
      - ipython3 -h
      - globus --help
      - zppy --help
      - if: linux
        then:
          - zstash --help
      - if: mpi != "nompi" and mpi != "hpc"
        then:
          - ilamb-fetch -h
          - ilamb-run -h
      - if: mpi != "hpc"
        then:
          - ncks --help
          - ncap2 --help
          - GenerateCSMesh --res 64 --alt --file gravitySam.000000.3d.cubedSphere.g
          - ESMF_RegridWeightGen --help
          - test -f ${PREFIX}/bin/Climatology
    requirements:
      run:
        - pytest

about:
  homepage: https://github.com/E3SM-Project/e3sm-unified
  summary: |
    A metapackage for a unified conda environment for analysis of results
    from the Energy Exascale Earth System Model (E3SM).
  license: BSD-3-Clause
  license_file: LICENSE
  repository: https://github.com/E3SM-Project/e3sm-unified
  documentation: https://github.com/E3SM-Project/e3sm-unified/blob/main/README.md


extra:
  recipe-maintainers:
    - andrewdnolan
    - xylar
